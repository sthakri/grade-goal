<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GradeGoal — What do I need on my final?</title>
  <meta name="description" content="Find out the exact score you need on your final exam to hit your target grade.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/scenarios.css">
</head>
<body>
  <header class="topbar">
    <h1>🎯 GradeGoal</h1>
    <p class="tagline">What do I need on my final?</p>
  </header>

  <main class="card">
    <section class="target-row">
      <label for="target-grade">Target grade</label>
      <select id="target-grade">
        <option value="93">A (93%)</option>
        <option value="90">A− (90%)</option>
        <option value="87" selected>B+ (87%)</option>
        <option value="83">B (83%)</option>
        <option value="80">B− (80%)</option>
        <option value="77">C+ (77%)</option>
        <option value="70">C (70%)</option>
        <option value="60">D (60%)</option>
      </select>
    </section>

    <section class="categories">
      <h2>Your graded work</h2>
      <table id="category-table">
        <thead>
          <tr><th>Category</th><th>Weight %</th><th>Your score %</th><th></th></tr>
        </thead>
        <tbody id="category-rows">
          <tr>
            <td><input type="text" value="Homework" aria-label="Category name"></td>
            <td><input type="number" value="20" min="0" max="100" aria-label="Weight"></td>
            <td><input type="number" value="92" min="0" max="100" aria-label="Score"></td>
            <td><button class="remove-row" aria-label="Remove category">✕</button></td>
          </tr>
          <tr>
            <td><input type="text" value="Quizzes" aria-label="Category name"></td>
            <td><input type="number" value="10" min="0" max="100" aria-label="Weight"></td>
            <td><input type="number" value="88" min="0" max="100" aria-label="Score"></td>
            <td><button class="remove-row" aria-label="Remove category">✕</button></td>
          </tr>
          <tr>
            <td><input type="text" value="Midterm" aria-label="Category name"></td>
            <td><input type="number" value="20" min="0" max="100" aria-label="Weight"></td>
            <td><input type="number" value="81" min="0" max="100" aria-label="Score"></td>
            <td><button class="remove-row" aria-label="Remove category">✕</button></td>
          </tr>
        </tbody>
      </table>
      <button id="add-row" class="ghost">+ Add category</button>
    </section>

    <section class="final-row">
      <label for="final-weight">Final exam weight %</label>
      <input type="number" id="final-weight" value="50" min="0" max="100">
    </section>

    <section class="result" id="result" aria-live="polite">
      <p class="placeholder">Your answer will appear here once the engine is wired up.</p>
    </section>
  </main>

  <section class="scenarios card">
    <h2>Saved scenarios</h2>
    <div class="save-row">
      <input type="text" id="scenario-name" placeholder="e.g. MATH 101, fall semester" maxlength="60" aria-label="Scenario name">
      <button id="save-scenario">Save current</button>
    </div>
    <ul id="scenario-list" aria-label="Saved scenarios"></ul>
  </section>

  <footer>
    <p>Built by a 4-person team as a git-workflow demo. <a href="WORKFLOW-GUIDE.md">See how we worked</a>.</p>
  </footer>
  <script src="js/engine.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
